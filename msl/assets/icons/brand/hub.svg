<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- MSL Tools hub app icon: a launcher grid of tools, the open one lit.
       Full-color on purpose (taskbar / window icon), not a #000000 one-color icon. -->
  <defs>
    <linearGradient id="hubBackground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4d96ff"/>
      <stop offset="1" stop-color="#2a6fc9"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#hubBackground)"/>
  <rect x="14" y="14" width="16" height="16" rx="4.5" fill="#ffffff"/>
  <rect x="34" y="14" width="16" height="16" rx="4.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="14" y="34" width="16" height="16" rx="4.5" fill="#ffffff" fill-opacity="0.5"/>
  <rect x="34" y="34" width="16" height="16" rx="4.5" fill="#ffffff" fill-opacity="0.5"/>
</svg>
